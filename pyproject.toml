[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coconut-harvester"
version = "2.0.0"
description = "Design, safety controller and plantation-scale verification of a coconut-palm climbing and harvesting robot"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]

[project.scripts]
coconut-harvester = "coconut_harvester.cli:main"

[tool.setuptools]
packages = ["coconut_harvester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["prodscale: long-running full-year verification (run with -m prodscale)"]
addopts = "-m 'not prodscale'"
