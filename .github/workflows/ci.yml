name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 0"   # weekly full-year soak
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Report is reproducible from the model
        run: |
          coconut-cutter report --out /tmp/docs
          diff -u docs/DESIGN.md /tmp/docs/DESIGN.md
          diff -u docs/front_view.svg /tmp/docs/front_view.svg
  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q -s -m prodscale
